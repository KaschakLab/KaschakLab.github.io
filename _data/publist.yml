- title: "An investigation of the feeling that an inter-turn silence has lasted too long"
  image: rpic.jpeg
  description: This study investigates the conversational sense that an inter-turn silence has lasted too long, finding that the feeling is driven by the typical response time for that specific question, not by a participant's general time perception biases or anxiety levels.
  authors: AM Thomas, MP Kaschak
  link:
    url: https://link.springer.com/article/10.3758/s13423-025-02760-z
    display: Access here
  highlight: 1

- title: "Non-sentential responses to requests for information"
  image: sent.png
  description: Speakers' use of short answers instead of full sentences is primarily determined by pragmatic goals like politeness and formality, with memory retrieval playing a more complex, context-dependent role.
  authors: CM Brousse, K Chia, M Kaschak
  link:
    url: https://link.springer.com/article/10.3758/s13421-024-01645-1
    display: Access here
  highlight: 1

- title: "Hysteresis in reach planning and spatial demonstrative choice"
  image: spatial.jpg
  description: This research demonstrates that the tendency to repeat a recent choice (hysteresis) occurs in both motor planning (reaching) and linguistic choices (selecting "this" vs. "that"), although some effects, like a speed advantage for repetition, were only observed in the motor task.
  authors: M Long, MP Kaschak
  link:
    url: https://journals.sagepub.com/doi/full/10.1177/17470218251318225
    display: Access here
  highlight: 1

