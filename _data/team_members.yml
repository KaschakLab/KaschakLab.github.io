- name: Dr. Michael Kaschak
  photo: mkbg.png
  info: Principal Investigator
  email: kaschak@psy.fsu.edu
  description: Mike is interested in all things related to language. At various times, his lab has conducted research on language comprehension, language production, language learning, and the application of psycholinguistic work to the development of literacy skills. 
  number_educ: 1
  education1: PhD, University of Wisconsin–Madison

- name: Katie Brousse | <a href="https://scholar.google.com/citations?user=PcoAH4QAAAAJ&hl=en&oi=sra">Google Scholar</a>
  photo: kb.png
  info: PhD Student, started August 2022
  email: brousse@psy.fsu.edu
  description: Katie's research interests lie at the intersection of language and cognition. She is particularly interested in understanding the mechanisms involved in understanding figurative language and other types of non-literal uses of language.
  number_educ: 1
  education1: BA, Loyola University New Orleans

- name: Anuja Thomas | <a href="https://scholar.google.com/citations?user=-KwblKQAAAAJ&hl=en&oi=ao">Google Scholar</a>
  photo: anu2.png
  info: PhD Student, started August 2023
  email: athomas@psy.fsu.edu
  description: Anuja is interested in understanding the temporal dynamics of conversation, particularly the timing of the transition between one speaker and another. She is especially interested in the individual and cultural factors that shape this timing, and the consequences that violations of conversational timing norms have for relationships. 
  number_educ: 1
  education1: BA, American University of Sharjah


- name: Nelu Radpour | <a href="https://scholar.google.com/citations?user=B5xj-8IAAAAJ&hl=en">Google Scholar</a>
  photo: nr.jpg
  info: PhD Student, started August 2024
  email: radpour@psy.fsu.edu
  description: Nelu is interested in the mechanisms of human learning, knowledge integration, and cognitive flexibility, using a mixed-methods approach that explores embodied cognition and the comparison between human and artificial intelligence.
  number_educ: 1
  education1: BA, University of Texas at Austin

